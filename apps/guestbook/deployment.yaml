apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-e2e-container
spec:
  replicas: 5
  selector:
    matchLabels:
      app: argocd-e2e-container
  template:
    metadata:
      labels:
        app: argocd-e2e-container
    spec:
      containers:
      - name: argocd-e2e-container
        image: quay.io/argoprojlabs/argocd-e2e-container:0.2
        ports:
        - containerPort: 80
